# Приложение + Caddy, который сам выпускает HTTPS-сертификат (Mini App работает только по HTTPS).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
